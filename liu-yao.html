  // 三傳計算器 (歲建、月建、日辰、時辰、旬空)
  function calculateSanChuan(dateObj) {
    const y = dateObj.getFullYear();
    const m = dateObj.getMonth() + 1;
    const d = dateObj.getDate();
    const h = dateObj.getHours();

    // 1. 歲建 (年傳) - 立春換歲 (約 2 月 4 日)
    let solarYear = y;
    if (m < 2 || (m === 2 && d < 4)) {
      solarYear = y - 1;
    }
    let yStemIdx = (solarYear - 4) % 10;
    if (yStemIdx < 0) yStemIdx += 10;
    let yBranchIdx = (solarYear - 4) % 12;
    if (yBranchIdx < 0) yBranchIdx += 12;
    const yearGZ = HEAVENLY_STEMS[yStemIdx] + EARTHLY_BRANCHES[yBranchIdx];

    // 2. 月建 (月傳) - 依 24 節氣月令交節約數
    const jieDays = [0, 5, 4, 5, 4, 5, 5, 6, 7, 7, 8, 7, 6];
    let mBranchIdx;
    if (m === 1) mBranchIdx = (d >= jieDays[1]) ? 1 : 0;
    else if (m === 2) mBranchIdx = (d >= jieDays[2]) ? 2 : 1;
    else if (m === 3) mBranchIdx = (d >= jieDays[3]) ? 3 : 2;
    else if (m === 4) mBranchIdx = (d >= jieDays[4]) ? 4 : 3;
    else if (m === 5) mBranchIdx = (d >= jieDays[5]) ? 5 : 4;
    else if (m === 6) mBranchIdx = (d >= jieDays[6]) ? 6 : 5;
    else if (m === 7) mBranchIdx = (d >= jieDays[7]) ? 7 : 6;
    else if (m === 8) mBranchIdx = (d >= jieDays[8]) ? 8 : 7;
    else if (m === 9) mBranchIdx = (d >= jieDays[9]) ? 9 : 8;
    else if (m === 10) mBranchIdx = (d >= jieDays[10]) ? 10 : 9;
    else if (m === 11) mBranchIdx = (d >= jieDays[11]) ? 11 : 10;
    else mBranchIdx = (d >= jieDays[12]) ? 0 : 11;

    // 五虎遁推月干
    const offsetFromYin = (mBranchIdx - 2 + 12) % 12;
    const startStemByYear = [2, 4, 6, 8, 0, 2, 4, 6, 8, 0][yStemIdx];
    const mStemIdx = (startStemByYear + offsetFromYin) % 10;
    const monthGZ = HEAVENLY_STEMS[mStemIdx] + EARTHLY_BRANCHES[mBranchIdx];

    // 3. 日辰 (日傳) - 高精確度 60 甲子日辰 (以 2000-01-01 戊午為錨點)
    const utcMs = Date.UTC(y, m - 1, d);
    const anchorMs = Date.UTC(2000, 0, 1);
    const diffDays = Math.round((utcMs - anchorMs) / 86400000);
    let dayIdx = (54 + diffDays) % 60;
    if (dayIdx < 0) dayIdx += 60;
    const dayGZ = JIA_ZI[dayIdx];
    const dayStem = dayGZ[0];
    const dayBranch = dayGZ[1];

    // 4. 旬空 (日空亡)
    const xunIdx = Math.floor(dayIdx / 10);
    const xunData = XUN_KONG_DATA[xunIdx];

    // 5. 時辰 (時干支) - 五鼠遁元
    const hBranchIdx = Math.floor((h + 1) / 2) % 12;
    const dayStemIdx = HEAVENLY_STEMS.indexOf(dayStem);
    const startHourStem = [0, 2, 4, 6, 8, 0, 2, 4, 6, 8][dayStemIdx];
    const hStemIdx = (startHourStem + hBranchIdx) % 10;
    const hourGZ = HEAVENLY_STEMS[hStemIdx] + EARTHLY_BRANCHES[hBranchIdx];

    return {
      yearGZ,
      monthGZ,
      dayGZ,
      hourGZ,
      yearStem: yearGZ[0],
      yearBranch: yearGZ[1],
      monthStem: monthGZ[0],
      monthBranch: monthGZ[1],
      dayStem,
      dayBranch,
      hourStem: hourGZ[0],
      hourBranch: hourGZ[1],
      xunName: xunData.name,
      kongWang: xunData.kong,
      kongBranches: xunData.branches
    };
  }

  function setNowTime() {
    const now = new Date();
    document.getElementById('ly-date').value = now.toISOString().split('T')[0];
    document.getElementById('ly-time').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    updateSanChuan();
    if (tossHistory.length === 6) renderChart();
  }

  function updateSanChuan() {
    const dVal = document.getElementById('ly-date').value;
    const tVal = document.getElementById('ly-time').value || '12:00';
    if (!dVal) return;

    const [y, m, d] = dVal.split('-').map(Number);
    const [hh, mm] = tVal.split(':').map(Number);
    const dateObj = new Date(y, m - 1, d, hh, mm);

    currentSanChuan = calculateSanChuan(dateObj);

    const dayGanSelect = document.getElementById('ly-day-gan');
    if (dayGanSelect && currentSanChuan.dayStem) {
      dayGanSelect.value = currentSanChuan.dayStem;
    }

    renderSanChuanBoard();
  }

        <div class="text-amber-900 font-bold">月令提拔生旺，日辰刑沖剋害生合神機</div>

  function handleToss() {
    if (tossHistory.length >= 6) {
      handleReset();
      return;
    }

    const c1 = Math.random() < 0.5 ? 0 : 1;
    const c2 = Math.random() < 0.5 ? 0 : 1;
    const c3 = Math.random() < 0.5 ? 0 : 1;
    const sum = c1 + c2 + c3;
    
    let val = 7;
    if (sum === 0) val = 6;
    else if (sum === 1) val = 7;
    else if (sum === 2) val = 8;
    else if (sum === 3) val = 9;

    tossHistory.push({ val, coins: [c1, c2, c3] });

    const coinsEl = document.getElementById('ly-coins-display');
    coinsEl.innerHTML = [c1, c2, c3].map(c => `
      <div class="coin-spinning w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 ${c === 1 ? 'border-amber-700 bg-gradient-to-br from-amber-200 via-amber-300 to-amber-400 text-amber-950' : 'border-stone-500 bg-gradient-to-br from-stone-100 via-stone-200 to-stone-300 text-stone-800'} flex items-center justify-center font-black text-sm sm:text-base shadow-xl relative">
        <div class="w-5 h-5 border-2 border-stone-800/40 bg-stone-50/90 rounded-xs flex items-center justify-center text-[10px] font-bold">
          ${c === 1 ? '天' : '地'}
        </div>
      </div>
    `).join('');

    updateTossUI();

    if (tossHistory.length === 6) {
      renderChart();
    }
  }

  function handleQuickCast() {
    handleReset();
    for (let i = 0; i < 6; i++) {
      const r = Math.random();
      let val = 7;
      if (r < 0.15) val = 6;
      else if (r < 0.50) val = 7;
      else if (r < 0.85) val = 8;
      else val = 9;
      tossHistory.push({ val, coins: [1, 1, 1] });
    }
    updateTossUI();
    renderChart();
  }

  function handleReset() {
    tossHistory = [];
    updateTossUI();
    
    const coinsEl = document.getElementById('ly-coins-display');
    if (coinsEl) {
      coinsEl.innerHTML = `
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-amber-600 bg-gradient-to-br from-amber-100 via-amber-200 to-amber-300 flex items-center justify-center font-black text-amber-900 text-sm sm:text-base shadow-lg relative">

  function updateTossUI() {
    const count = tossHistory.length;
    document.getElementById('ly-toss-count').innerText = count;

    const btnTextEl = document.getElementById('ly-toss-btn-text');
    const btnToss = document.getElementById('ly-btn-toss');

    const stepLabels = [
      '🪙 擲出初爻',
      '🪙 擲出二爻',
      '🪙 擲出三爻',
      '🪙 擲出四爻',
      '🪙 擲出五爻',
      '🪙 擲出上爻 (定卦)'
    ];

    if (count < 6) {
      btnTextEl.innerText = stepLabels[count];
      btnToss.className = 'w-full sm:w-auto min-w-[240px] bg-red-900 hover:bg-red-800 active:scale-95 text-amber-50 font-bold px-8 py-3.5 rounded-full shadow-lg transition duration-150 text-sm sm:text-base tracking-widest flex items-center justify-center gap-2';
    } else {
      btnTextEl.innerText = '🔄 重新手搖起卦';
      btnToss.className = 'w-full sm:w-auto min-w-[240px] bg-emerald-800 hover:bg-emerald-700 active:scale-95 text-white font-bold px-8 py-3.5 rounded-full shadow-lg transition duration-150 text-sm sm:text-base tracking-widest flex items-center justify-center gap-2';
    }

    const stackEl = document.getElementById('ly-live-yao-stack');
    if (stackEl) {
      const yaoNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
      const valLabels = {
        6: { name: '老陰 ✕', desc: '動爻變陽', color: 'text-rose-700 font-black' },
        7: { name: '少陽 ⚊', desc: '靜爻', color: 'text-stone-800 font-bold' },
        8: { name: '少陰 ⚋', desc: '靜爻', color: 'text-stone-600 font-bold' },
        9: { name: '老陽 〇', desc: '動爻變陰', color: 'text-red-700 font-black' }
      };

      if (count === 0) {
        stackEl.innerHTML = '<span class="text-stone-400 text-xs">靜心誠意，點擊上方按鈕開始擲出第一爻</span>';
      } else {
        stackEl.innerHTML = tossHistory.map((t, idx) => {
          const isYang = (t.val === 7 || t.val === 9);
          const isDong = (t.val === 6 || t.val === 9);
          const meta = valLabels[t.val];
          return `
            <div class="w-full flex items-center justify-between px-3 py-1 bg-stone-50 border border-stone-200 rounded-md">
              <span class="font-bold text-stone-700 w-10">${yaoNames[idx]}</span>
              <span class="w-20 text-center font-mono ${meta.color}">${meta.name}</span>
              <div class="w-24 flex items-center justify-center">
                ${isYang ? `
                  <div class="w-16 h-2 bg-stone-800 rounded-xs flex items-center justify-center">
                    ${isDong ? '<span class="text-[8px] text-amber-300 font-black">〇</span>' : ''}
                  </div>
                ` : `
                  <div class="w-16 flex gap-1.5 justify-between">
                    <div class="w-7 h-2 bg-stone-800 rounded-xs flex items-center justify-center">
                      ${isDong ? '<span class="text-[7px] text-amber-300 font-black">✕</span>' : ''}
                    </div>
                    <div class="w-7 h-2 bg-stone-800 rounded-xs"></div>
                  </div>
                `}
              </div>
              <span class="text-[10px] ${isDong ? 'text-red-700 font-bold' : 'text-stone-400'} w-12 text-right">${isDong ? '發動' : '安靜'}</span>
            </div>
          `;
        }).join('');
      }
    }
  }

  function renderChart() {
    const dayGan = document.getElementById('ly-day-gan').value;
    const sixGods = SIX_GODS_MAP[dayGan] || SIX_GODS_MAP['戊'];
    const question = document.getElementById('ly-question').value || '未填寫占問事項';

    // tossHistory[0] 是初爻，tossHistory[1] 是二爻 ... tossHistory[5] 是上爻（由下至上起卦）
    const yaoStates = [];
    for (let i = 0; i < 6; i++) {
      const v = tossHistory[i].val;
      const isYang = (v === 7 || v === 9);
      const isDong = (v === 6 || v === 9);
      const bianYang = isDong ? !isYang : isYang;
      yaoStates.push({ val: v, isYang, isDong, bianYang });
    }

    // 內卦（下卦）：初爻(0)、二爻(1)、三爻(2) -> 八卦讀卦為自上而下（三爻、二爻、初爻）
    const lowerKey = (yaoStates[2].isYang ? '1' : '0') + (yaoStates[1].isYang ? '1' : '0') + (yaoStates[0].isYang ? '1' : '0');
    // 外卦（上卦）：四爻(3)、五爻(4)、上爻(5) -> 八卦讀卦為自上而下（上爻、五爻、四爻）
    const upperKey = (yaoStates[5].isYang ? '1' : '0') + (yaoStates[4].isYang ? '1' : '0') + (yaoStates[3].isYang ? '1' : '0');

    // 之卦（變卦）內外卦
    const bLowerKey = (yaoStates[2].bianYang ? '1' : '0') + (yaoStates[1].bianYang ? '1' : '0') + (yaoStates[0].bianYang ? '1' : '0');
    const bUpperKey = (yaoStates[5].bianYang ? '1' : '0') + (yaoStates[4].bianYang ? '1' : '0') + (yaoStates[3].bianYang ? '1' : '0');

    // 六十四卦查詢鍵：自上而下讀卦（外卦在上，內卦在下；即上爻、五爻、四爻、三爻、二爻、初爻）
    const benBin = upperKey + lowerKey;
    const bianBin = bUpperKey + bLowerKey;

    const benMeta = HEXAGRAM_PALACES[benBin] || { name: '未知卦', palace: '乾', palaceElement: '金', shi: 1 };
    const bianMeta = HEXAGRAM_PALACES[bianBin] || { name: '未知卦', palace: '坤', palaceElement: '土', shi: 1 };
    const hasDong = yaoStates.some(y => y.isDong);

    // 裝卦納甲地支（京房易初爻到上爻）：
    // lowerTri.branches[0~2] 為內卦初、二、三爻；upperTri.branches[3~5] 為外卦四、五、六爻
    const lowerTri = TRIGRAMS[lowerKey];
    const upperTri = TRIGRAMS[upperKey];
    const benBranches = [
      lowerTri.branches[0], lowerTri.branches[1], lowerTri.branches[2],
      upperTri.branches[3], upperTri.branches[4], upperTri.branches[5]
    ];

    const bLowerTri = TRIGRAMS[bLowerKey];
    const bUpperTri = TRIGRAMS[bUpperKey];
    const bianBranches = [
      bLowerTri.branches[0], bLowerTri.branches[1], bLowerTri.branches[2],
      bUpperTri.branches[3], bUpperTri.branches[4], bUpperTri.branches[5]
    ];

    const rows = [];
    const yaoNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];

    // 讀卦與視覺呈現：由上而下（上爻 i=5 降至 初爻 i=0）
    for (let i = 5; i >= 0; i--) {
      const bBranch = benBranches[i];
      const bElem = BRANCH_ELEMENTS[bBranch];
      const relation = RELATIONS_RULES[benMeta.palaceElement][bElem];
      const isShi = (benMeta.shi === (i + 1));
      const isYing = ((benMeta.shi + 3) % 6 || 6) === (i + 1);
      const god = sixGods[i];
      const y = yaoStates[i];

      const biBranch = bianBranches[i];
      const biElem = BRANCH_ELEMENTS[biBranch];
      const biRelation = RELATIONS_RULES[benMeta.palaceElement][biElem];

      const isYueJian = (bBranch === currentSanChuan.monthBranch);
      const isYuePo = (OPPOSITE_BRANCHES[bBranch] === currentSanChuan.monthBranch);
      const isRiChen = (bBranch === currentSanChuan.dayBranch);
      const isRiChong = (OPPOSITE_BRANCHES[bBranch] === currentSanChuan.dayBranch);
      const isKongWang = currentSanChuan.kongBranches && currentSanChuan.kongBranches.includes(bBranch);

      rows.push({
        idx: i + 1,
        yaoName: yaoNames[i],
        god,
        relation,
        branch: bBranch,
        elem: bElem,
        isYang: y.isYang,
        isDong: y.isDong,
        val: y.val,
        isShi,
        isYing,
        isYueJian,
        isYuePo,
        isRiChen,
        isRiChong,
        isKongWang,
        biRelation,
        biBranch,
        biElem,
        biYang: y.bianYang
      });
    }

    const container = document.getElementById('ly-result-area');
    container.classList.remove('hidden');
