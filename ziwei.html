<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>癒見幸福 · 紫微斗數星盤大典</title>
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet"><script src="./js/meetjoy-pdf.js"></script><script src="./js/ziwei-calc.js"></script>
<style>body{font-family:'Noto Serif TC',serif;background:#f4f1ea;color:#1e293b}.palace{min-height:178px;cursor:pointer;transition:.2s;border:1px solid #e2d9c8;background:#fffdf8}.palace:hover,.palace.active{transform:translateY(-2px);border-color:#b8860b;box-shadow:0 10px 22px #5b481522}.palace.related{background:#fff7df;border-color:#d4a329}.star{display:inline-flex;margin:1px 3px 1px 0;font-weight:900;color:#374151}.grade{font-size:10px;color:#a16207;margin-left:1px}.badge{display:inline-block;border-radius:999px;padding:1px 5px;margin:1px;font-size:10px;font-weight:900;background:#fee2e2;color:#9f1239}.line-note{color:#92700c;font-size:11px;font-weight:bold}.center-card{background:radial-gradient(circle at top,#fff9e9,#eee2c5);border:2px solid #c8a97e}.print-title{display:none}@media print{.print-title{display:block}.palace{min-height:128px!important}.no-print{display:none!important}#chart{grid-template-columns:repeat(4,1fr)!important}}</style></head>
<body class="min-h-screen"><nav class="no-print w-full bg-[#1E261D] text-amber-50 py-3 px-4 sm:px-8 flex flex-wrap items-center justify-between border-b border-[#C8A97E]/50 sticky top-0 z-50"><a href="/" class="font-black text-lg text-[#F7E7CE]">🔮 癒見幸福 · 魔法神算</a><div class="flex gap-1 text-xs overflow-x-auto"><a href="/astrology.html" class="px-2 py-1.5">西洋占星</a><a href="/chakra-astrology.html" class="px-2 py-1.5">脈輪占星</a><a href="/destiny-cards.html" class="px-2 py-1.5">撲克命牌</a><a href="/human-design.html" class="px-2 py-1.5">人類圖</a><a href="/ziwei.html" class="px-2 py-1.5 rounded bg-[#C8A97E] text-stone-900 font-black">紫微斗數</a><a href="/xiao-liu-ren.html" class="px-2 py-1.5">四盤小六壬</a><a href="/liu-yao.html" class="px-2 py-1.5">文王六爻</a><a href="/gene-keys.html" class="px-2 py-1.5">基因天命</a></div></nav>
<main class="max-w-7xl mx-auto p-4 sm:p-7"><header class="text-center mb-6"><p class="text-xs tracking-[.32em] text-[#987315] font-black">ZI WEI DOU SHU · RADIX</p><h1 class="text-3xl sm:text-4xl font-black mt-2">紫微斗數星盤大典</h1><p class="text-sm text-stone-600 mt-2">癒見幸福 · 魔法占星學院｜點選宮位，展開三方四正與生活魔藥解讀。</p></header>
<form id="form" class="no-print bg-white border border-[#e2d9c8] rounded-3xl p-4 mb-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3 items-end"><label class="text-xs font-bold">曆法<select id="calendar" class="mt-1 w-full rounded-lg border p-2"><option>陽曆</option><option>農曆</option></select></label><label class="text-xs font-bold">出生日期<input id="date" type="date" value="1990-01-27" class="mt-1 w-full rounded-lg border p-2"></label><label class="text-xs font-bold">出生時辰<select id="hour" class="mt-1 w-full rounded-lg border p-2"></select></label><label class="text-xs font-bold">命造<select id="gender" class="mt-1 w-full rounded-lg border p-2"><option value="男">乾造</option><option value="女">坤造</option></select></label><label class="text-xs font-bold">閏月<input id="leap" type="checkbox" class="ml-2 accent-amber-700"><span class="font-normal">（農曆適用）</span></label><label class="text-xs font-bold">流年<select id="year" class="mt-1 w-full rounded-lg border p-2"></select></label><div class="flex gap-2"><button class="flex-1 bg-[#2b3828] text-amber-100 p-2 rounded-xl font-black">排定星盤</button><button type="button" onclick="MeetJoyPDF.exportPDF({title:'紫微斗數星盤大典'})" class="bg-[#c8a97e] p-2 rounded-xl font-black">PDF</button></div></form>
<h2 class="print-title text-xl font-black mb-3">癒見幸福 · 紫微斗數星盤大典</h2><section id="summary" class="grid grid-cols-2 lg:grid-cols-6 gap-3 mb-5"></section><section id="chart" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></section><section id="reading" class="mt-6 rounded-3xl bg-white border border-[#e2d9c8] p-6 shadow-sm"></section></main>
<script>
const $=s=>document.querySelector(s), h=$('#hour'), y=$('#year');['早子時（23:00）','丑時（01:00）','寅時（03:00）','卯時（05:00）','辰時（07:00）','巳時（09:00）','午時（11:00）','未時（13:00）','申時（15:00）','酉時（17:00）','戌時（19:00）','亥時（21:00）','晚子時（23:00）'].forEach((t,i)=>h.add(new Option(t,i)));h.value=6;for(let i=1950;i<=2100;i++)y.add(new Option(i+' 年流年',i));y.value=new Date().getFullYear();let chart,selected;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){try{chart=MeetJoyZiWei.calc({calendar:$('#calendar').value,date:$('#date').value,hour:h.value,gender:$('#gender').value,leap:$('#leap').checked});selected=chart.命宮;draw()}catch(e){alert('資料格式無法排盤，請確認出生日期。');console.error(e)}}
function draw(){let c=chart, lp=c.lunar, targetYear=Number(y.value), age=targetYear-lp.year+1, info=[['農曆生辰',`${lp.year}年${lp.month}月${lp.day}日${lp.leap?'（閏月）':''}`],['生年干支',c.yearGan+c.yearZhi+'年'],['五行局',c.bureau],['命主',c.lifeMaster],['身主',c.bodyMaster],['流年提示',`${targetYear} 年｜虛歲 ${age}`],['生年四化',c.transformations.map((n,i)=>n+['化祿','化權','化科','化忌'][i]).join('、')]];$('#summary').innerHTML=info.map(x=>`<div class="bg-white rounded-2xl border border-[#e2d9c8] p-3"><p class="text-[11px] text-stone-500">${x[0]}</p><p class="font-black text-sm mt-1">${x[1]}</p></div>`).join('');let related=[selected,mod(selected+6),mod(selected+4),mod(selected+8)];$('#chart').innerHTML=c.palaces.map(p=>`<article data-i="${p.index}" class="palace rounded-2xl p-3 ${p.index===selected?'active':''} ${related.includes(p.index)?'related':''} ${age>=p.decadal[0]&&age<=p.decadal[1]?'ring-2 ring-amber-400':''}"><div class="flex justify-between"><b>${p.name}${p.isBody?' <span class="text-rose-700">身</span>':''}</b><span class="text-xs text-stone-500">${p.stem}${p.branch}</span></div><div class="mt-2">${p.stars.map(s=>`<span class="star">${s.name}<i class="grade">${s.grade}</i></span>`).join('')||'<span class="text-xs text-stone-400">空宮借對宮</span>'}</div><div class="mt-1 text-xs text-slate-600">${p.minor.join('　')}</div><div>${p.badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div><p class="line-note mt-2">大限 ${p.decadal[0]}–${p.decadal[1]} 歲 · 流年 ${p.annual} 歲</p></article>`).join('');$('#chart').onclick=e=>{let node=e.target.closest('[data-i]');if(node){selected=+node.dataset.i;draw()}};let p=c.palaces[selected], opposed=c.palaces[mod(selected+6)], trines=[c.palaces[mod(selected+4)],c.palaces[mod(selected+8)]];$('#reading').innerHTML=`<p class="text-xs font-black text-[#987315] tracking-widest">宮位魔藥解讀</p><h2 class="text-2xl font-black mt-2">${p.name}${p.isBody?'（身宮）':''}｜${p.stem}${p.branch}</h2><p class="mt-3 leading-8 text-stone-700">此宮主星為 <b>${p.stars.map(s=>s.name).join('、')||'空宮（借對宮星曜）'}</b>。${p.name==='命宮'?'它像你的生命角色設定：先看自己如何啟動，再看世界如何回應。':'把這個宮位當作生活的一間房：先辨識它的需要，再安排你能每日做到的小行動。'}</p><div class="mt-4 grid md:grid-cols-2 gap-3"><div class="rounded-2xl bg-amber-50 border border-amber-200 p-4"><b>三方四正</b><p class="mt-2 text-sm">本宮：${p.name}｜對宮：${opposed.name}｜三合：${trines.map(x=>x.name).join('、')}</p></div><div class="rounded-2xl bg-stone-50 border border-stone-200 p-4"><b>流年生活魔藥</b><p class="mt-2 text-sm">${targetYear} 年，請選一件和「${p.name}」相關、能在 15 分鐘內完成的事，讓命盤從解讀走進生活。</p></div></div>`}function mod(n){return (n%12+12)%12}$('#form').onsubmit=e=>{e.preventDefault();render()};render();
</script></body></html>
