services:
  web-test:
    build: .
    container_name: ziwei-web-test
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    working_dir: /app
    environment:
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev:test"
    profiles:
      - test
